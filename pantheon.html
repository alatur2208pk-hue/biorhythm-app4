<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пантеон Богов — Ведаем РА</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pantheon.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Philosopher:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== ЗВЁЗДЫ ===== -->
    <div class="stars" id="stars"></div>

    <!-- ===== ВЕРХНЕЕ ВЫПАДАЮЩЕЕ МЕНЮ ===== -->
    <nav class="top-nav" id="topNav">
        <div class="top-nav-header">
            <button class="top-nav-trigger" aria-label="Открыть меню">
                <img src="images/alatyr.png" alt="Алатырь">
            </button>
            <span class="top-nav-title">Меню</span>
        </div>

        <div class="top-nav-menu">
            <a href="index.html" class="top-nav-link">
                <span class="sidebar-icon">📊</span>
                <span class="sidebar-text">Биоритмы</span>
            </a>
            <a href="svarog-circle.html" class="top-nav-link">
                <img src="images/svarog-circle/circle-icon.png" alt="Сварожий круг" class="sidebar-icon-img">
                <span class="sidebar-text">Сварожий круг</span>
            </a>
            <a href="pantheon.html" class="top-nav-link active">
                <span class="sidebar-icon">🔆</span>
                <span class="sidebar-text">Пантеон богов</span>
            </a>
            <a href="galactic-day.html" class="top-nav-link">
                <img src="images/galactic-day/icon.png" alt="Галактические сутки" class="sidebar-icon-img">
                <span class="sidebar-text">Галактические сутки</span>
            </a>
            <a href="atlas.html" class="top-nav-link">
                <span class="sidebar-icon">🗺️</span>
                <span class="sidebar-text">Атлас Судьбы</span>
            </a>

            <button class="top-nav-logout">
                <span class="sidebar-icon">🚪</span>
                <span class="sidebar-text">Выйти</span>
            </button>

            <div class="top-nav-version">v1.0</div>
        </div>
    </nav>

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <main class="main-content">
        <div id="pantheonApp">
            <h1>🔆 Пантеон Богов</h1>
            <p class="subtitle">Светлые Боги славян и ариев</p>

            <!-- ===== ПОИСК ===== -->
            <div class="pantheon-search-wrap">
                <span class="pantheon-search-icon">🔍</span>
                <input type="text" id="pantheonSearchInput" class="pantheon-search-input" placeholder="Найти бога по имени...">
            </div>

            <!-- ===== СЕКЦИИ БОГОВ ===== -->
            <div id="pantheonContainer"></div>
        </div>

        <!-- ===== МОДАЛЬНОЕ ОКНО БОГА ===== -->
        <div id="godModal" class="god-modal">
            <div class="god-modal-content">
                <button id="closeGodModal" class="god-modal-close">✕</button>

                <!-- ===== ОРНАМЕНТ СВЕРХУ ===== -->
                <div class="god-scroll-ornament god-scroll-ornament-top">
                    <svg viewBox="0 0 600 30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <pattern id="meanderTop" x="0" y="0" width="60" height="30" patternUnits="userSpaceOnUse">
                                <path d="M 0 5 L 50 5 L 50 25 L 15 25 L 15 15 L 40 15 L 40 10 L 0 10"
                                      fill="none" stroke="#3a2a15" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
                                <path d="M 0 0 L 60 0" fill="none" stroke="#3a2a15" stroke-width="2"/>
                                <path d="M 0 30 L 60 30" fill="none" stroke="#3a2a15" stroke-width="2"/>
                            </pattern>
                        </defs>
                        <rect x="0" y="0" width="600" height="30" fill="url(#meanderTop)"/>
                    </svg>
                </div>

                <!-- ===== КОНТЕНТ ===== -->
                <div class="god-modal-scroll">
                    <div class="god-modal-icon">🔆</div>
                    <h2 class="god-modal-name"></h2>
                    <div class="god-modal-desc"></div>
                </div>

                <!-- ===== ОРНАМЕНТ СНИЗУ ===== -->
                <div class="god-scroll-ornament god-scroll-ornament-bottom">
                    <svg viewBox="0 0 600 30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <pattern id="meanderBottom" x="0" y="0" width="60" height="30" patternUnits="userSpaceOnUse">
                                <path d="M 0 5 L 50 5 L 50 25 L 15 25 L 15 15 L 40 15 L 40 10 L 0 10"
                                      fill="none" stroke="#3a2a15" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
                                <path d="M 0 0 L 60 0" fill="none" stroke="#3a2a15" stroke-width="2"/>
                                <path d="M 0 30 L 60 30" fill="none" stroke="#3a2a15" stroke-width="2"/>
                            </pattern>
                        </defs>
                        <rect x="0" y="0" width="600" height="30" fill="url(#meanderBottom)"/>
                    </svg>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/pantheon.js"></script>

    <!-- ===== ВЕРХНЕЕ МЕНЮ ===== -->
    <script src="js/nav.js"></script>
</body>
</html>
